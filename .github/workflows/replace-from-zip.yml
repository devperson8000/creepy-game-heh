name: Replace game from uploaded ZIP

on:
  push:
    branches:
      - zip-uploads
    paths:
      - '*.zip'
      - '**/*.zip'
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: creepy-game-zip-replacement
  cancel-in-progress: false

jobs:
  replace:
    name: Safely replace main from the ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Check out the ZIP upload commit
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: upload
          fetch-depth: 0

      - name: Download the ZIP attached to the release
        if: github.event_name == 'release'
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ../incoming
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern '*.zip' --dir ../incoming
          mapfile -t release_zips < <(find ../incoming -maxdepth 1 -type f -iname '*.zip' -print)
          if [ "${#release_zips[@]}" -ne 1 ]; then
            echo "Attach exactly one .zip asset to each release; found ${#release_zips[@]}."
            exit 1
          fi
          mv "${release_zips[0]}" ../incoming/game-upload.zip

      - name: Validate ZIP and stage full replacement (branch upload)
        if: github.event_name == 'push'
        working-directory: repo
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/replace_from_zip.py
          --upload-repo-root ../upload
          --repo-root .

      - name: Validate ZIP and stage full replacement (release asset)
        if: github.event_name == 'release'
        working-directory: repo
        run: >-
          python3 .github/scripts/replace_from_zip.py
          --archive-path ../incoming/game-upload.zip
          --repo-root .

      - name: Commit replacement to main
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The ZIP produced no repository changes; nothing to commit."
            exit 1
          fi
          git commit -m "Replace game from uploaded ZIP"
          git push origin HEAD:main
